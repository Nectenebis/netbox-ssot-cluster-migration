[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "netbox-vm-reconcile"
version = "0.2.1"
description = "Preserve NetBox VM identity across VMware cluster migrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyvmomi>=8.0.3,<10", "pynetbox>=7.5,<8", "PyYAML>=6.0.2,<7", "requests>=2.32.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<3", "types-PyYAML", "types-requests", "build"]

[project.scripts]
netbox-vm-reconcile = "netbox_vm_reconcile.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
