# Copy to /etc/netbox-vm-reconcile/config.yaml; do not store secrets here.
netbox:
  url: https://netbox.example.local
  token: ${NETBOX_TOKEN}
  timeout: 30
  # ca_file: /etc/ssl/certs/company-ca-bundle.pem
state:
  database: /var/lib/netbox-vm-reconcile/state.db
vmware:
  # Must exactly match the source name configured in netbox-ssot.
  - name: mvcenter
    hostname: mvcenter.example.local
    username: ${VCENTER_USER}
    password: ${VCENTER_PASSWORD}
    expected_uuid: 11111111-1111-4111-8111-111111111111
    source_tag: 'Source: mvcenter'  # Match custom SSoT tag if configured.
    port: 443
    timeout: 30
    ignore_templates: true
    # ca_file: /etc/ssl/certs/company-ca-bundle.pem
    # Explicit vSphere MoRef -> existing NetBox ID, NOT VM identity keys.
    cluster_ids:
      domain-c101: 10  # DevTest
      domain-c102: 20  # prod62
    host_ids:
      host-201: 101  # mesx002 in DevTest
      host-202: 102  # mesx001 in prod62
  # Additional vCenters use their own UUID, source, credentials and mappings.
reconcile:
  allow_rename: true
  allow_cluster_change: true
  allow_host_change: true
  allow_site_change: true
