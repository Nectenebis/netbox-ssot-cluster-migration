# Copy to /etc/netbox-vm-reconcile/config.yaml; do not store secrets here.
netbox:
  url: https://netbox.example.local
  token: ${NETBOX_TOKEN}
  timeout: 30
  # ca_file: /etc/ssl/certs/company-ca-bundle.pem
state:
  database: /var/lib/netbox-vm-reconcile/state.db
vmware:
  # Must exactly match the source name configured in netbox-ssot.
  - name: mvcenter
    hostname: mvcenter.example.local
    username: ${VCENTER_USER}
    password: ${VCENTER_PASSWORD}
    # UUID is discovered and saved by bootstrap --apply; no manual UUID needed.
    # expected_uuid: 11111111-1111-4111-8111-111111111111  # Optional extra pin.
    # source_tag: 'Source: mvcenter'  # Optional; defaults to Source: <name>.
    verify_ssl: true  # Set false to disable vCenter certificate/hostname verification.
    port: 443
    timeout: 30
    ignore_templates: true
    # ca_file: /etc/ssl/certs/company-ca-bundle.pem
    # Cluster/ESXi discovery uses source + source_id, then unique name + source.
    # Manual overrides are optional, only for objects that cannot be discovered:
    # cluster_ids: {domain-c101: 10, domain-c102: 20}
    # host_ids: {host-201: 101, host-202: 102}
  # Additional vCenters use their own source names and credentials.
reconcile:
  allow_rename: true
  allow_cluster_change: true
  allow_host_change: true
  allow_site_change: true
