# Install as /etc/systemd/system/netbox-ssot.service.d/reconcile.conf
# Prepare config, permissions, state, bootstrap and dry-run BEFORE enabling.
# reconcile includes automatic VM bootstrap and SQLite-only cleanup each run.
# Missing new VMs are left for SSoT and registered on the next run after creation.
[Service]
EnvironmentFile=/etc/netbox-vm-reconcile/credentials.env
ExecStartPre=/opt/netbox-vm-reconcile/.venv/bin/netbox-vm-reconcile reconcile --config /etc/netbox-vm-reconcile/config.yaml --apply
# For large inventories; choose an explicit upper bound for your infrastructure.
TimeoutStartSec=30min

# If the existing unit has ProtectSystem/ReadWritePaths restrictions, permit
# /var/lib/netbox-vm-reconcile there. Run under the existing SSoT service user.
